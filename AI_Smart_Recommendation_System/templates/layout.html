<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Recommendation System</title>
    <!-- Add FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dark-mode">

    <nav class="navbar">
        <div class="logo">
            <h2><i class="fas fa-brain"></i> AI Recommender</h2>
        </div>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="{{ url_for('movies') }}"><i class="fas fa-film"></i> Movies</a></li>
            <li><a href="{{ url_for('books') }}"><i class="fas fa-book"></i> Books</a></li>
            <li><a href="{{ url_for('food') }}"><i class="fas fa-utensils"></i> Food</a></li>
            {% if current_user.is_authenticated %}
                <li><a href="{{ url_for('profile') }}"><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            {% else %}
                <li><a href="{{ url_for('login') }}"><i class="fas fa-sign-in-alt"></i> Login</a></li>
            {% endif %}
        </ul>
        <button id="theme-toggle" class="btn-theme"><i class="fas fa-sun"></i></button>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; 2024 AI Smart Recommendation System</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

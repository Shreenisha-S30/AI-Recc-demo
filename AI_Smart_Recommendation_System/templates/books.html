{% extends 'layout.html' %}

{% block content %}
<h2>Book Recommendations</h2>
<div class="form-container">
    <form id="book-search-form">
        <div class="form-group">
            <label for="query">Search a book:</label>
            <input type="text" id="query" name="query" class="form-control" placeholder="e.g. 1984..." required>
        </div>
        <button type="submit" class="btn">Search</button>
    </form>
</div>

<div id="search-results" class="results-grid" style="margin-bottom: 2rem;"></div>

<div class="loading-spinner" id="loading-book" style="display: none;">
    <div class="spinner"></div>
    <p>AI is thinking...</p>
</div>

<h3 id="rec-title" style="display: none;">Recommended For You</h3>
<div id="book-results" class="results-grid"></div>
{% endblock %}

{% block scripts %}
<script>
    $('#book-search-form').on('submit', function(e) {
        e.preventDefault();
        $('#search-results').empty();
        $.ajax({
            url: '/api/book/search',
            method: 'POST',
            data: $(this).serialize(),
            success: function(response) {
                if (response.length > 0) {
                    response.forEach(function(book) {
                        let html = `
                            <div class="result-card card">
                                <img src="${book.cover}" alt="${book.title}" class="card-img" onerror="this.src='https://via.placeholder.com/300x450?text=No+Cover'">
                                <div class="card-content">
                                    <h3>${book.title}</h3>
                                    <p>${book.author}</p>
                                    <button class="btn get-recs-btn" data-title="${book.title}" data-author="${book.author}" style="margin-top: 10px;">Get Recommendations</button>
                                </div>
                            </div>
                        `;
                        $('#search-results').append(html);
                    });
                } else {
                    $('#search-results').append('<p>No books found.</p>');
                }
            }
        });
    });

    $(document).on('click', '.get-recs-btn', function() {
        let title = $(this).data('title');
        let author = $(this).data('author');
        $('#loading-book').show();
        $('#book-results').empty();
        $('#rec-title').show();
        
        $('html, body').animate({
            scrollTop: $("#loading-book").offset().top - 50
        }, 500);
        
        $.ajax({
            url: '/recommend/book',
            method: 'POST',
            data: { title: title, author: author },
            success: function(response) {
                $('#loading-book').hide();
                if(response.length > 0) {
                    response.forEach(function(book) {
                        let html = `
                            <div class="result-card card">
                                <img src="${book.cover}" alt="${book.title}" class="card-img" onerror="this.src='https://via.placeholder.com/300x450?text=No+Cover'">
                                <div class="card-content">
                                    <h3>${book.title}</h3>
                                    <p><strong>Author:</strong> ${book.author}</p>
                                    <p class="match-score" style="color: #4CAF50; font-weight: bold;">${book.match_score}</p>
                                    <p class="description">${book.description ? book.description.substring(0, 100) : ''}...</p>
                                    <div class="actions" style="margin-top: 10px; display: flex; gap: 10px; flex-direction: column;">
                                        <button class="btn btn-fav" data-id="${book.id}" data-title="${book.title}" data-img="${book.cover}">❤️ Favorite</button>
                                        <div style="display: flex; align-items: center; gap: 5px;">
                                            <select class="rating-val" style="padding: 5px;">
                                                <option value="5">⭐⭐⭐⭐⭐</option>
                                                <option value="4">⭐⭐⭐⭐</option>
                                                <option value="3">⭐⭐⭐</option>
                                                <option value="2">⭐⭐</option>
                                                <option value="1">⭐</option>
                                            </select>
                                            <button class="btn btn-rate" data-id="${book.id}">Rate</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        $('#book-results').append(html);
                    });
                } else {
                    $('#book-results').append('<p>No recommendations found.</p>');
                }
            }
        });
    });

    $(document).on('click', '.btn-fav', function() {
        let btn = $(this);
        let data = {
            item_id: btn.data('id'),
            item_type: 'book',
            title: btn.data('title'),
            image_url: btn.data('img')
        };
        $.ajax({
            url: '/api/favorite',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response) {
                alert(response.message);
            }
        });
    });

    $(document).on('click', '.btn-rate', function() {
        let btn = $(this);
        let id = btn.data('id');
        let rating = btn.siblings('.rating-val').val();
        let data = {
            item_id: id,
            item_type: 'book',
            rating: rating
        };
        $.ajax({
            url: '/api/rate',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response) {
                alert(response.message);
            }
        });
    });
</script>
{% endblock %}
